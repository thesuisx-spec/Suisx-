name: Package Lexikon for Windows

# Publishes Lexikon-Windows.zip at a permanent link:
# https://github.com/<owner>/<repo>/releases/download/lexikon/Lexikon-Windows.zip
on:
  push:
    branches: [claude/falling-words-japanese-game-rnzfjp]
    paths:
      - dictionary/**
      - '!dictionary/tools/build_dict.py'
      - Start-Lexikon.bat
      - .github/workflows/package-windows.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-windows
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/falling-words-japanese-game-rnzfjp

      - name: Build zip
        run: dictionary/tools/package_windows.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lexikon --yes --cleanup-tag || true
          gh release create lexikon Lexikon-Windows.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Лексикон для Windows" \
            --notes "Скачайте Lexikon-Windows.zip, распакуйте (правой кнопкой → «Извлечь все») и дважды щёлкните Start-Lexikon.bat. Интернет не нужен."
